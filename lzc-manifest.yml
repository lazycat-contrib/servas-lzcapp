application:
  subdomain: servas
  multi_instance: false
  # Servas ships its own account system (local register + login via Laravel
  # Fortify). Signup and login use email + password only and never send mail,
  # so it can be exposed directly and authenticate itself.
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://servas:80/
services:
  servas:
    # upstream: docker.io/beromir/servas:1.1.3
    image: docker.1ms.run/beromir/servas:1.1.3
    environment:
      - APP_NAME=Servas
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:{{ stable_secret "servas_app_key" | replace "\r" "" | replace "\n" "" }}
      - APP_URL=https://{{ .S.AppDomain }}
      - SERVAS_ENABLE_REGISTRATION=true
      - SERVAS_SHOW_APP_VERSION=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/database/sqlite/database.sqlite
      - DB_FOREIGN_KEYS=true
      - SESSION_DRIVER=database
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=warning
    binds:
      - /lzcapp/var/sqlite:/app/database/sqlite
usage: |-
  Servas 是一个自托管书签管理器：标签、分组、分享列表，可配合浏览器扩展使用，
  数据存在本地 SQLite，不需要外部数据库。

  首次使用：
    - 打开后点“注册”，用邮箱 + 密码建一个账号即可。不会发送验证邮件，
      邮箱只当登录名用，不需要能收信。
    - 系统没有内置账号，也没有默认口令。

  说明：
    - 应用自带注册与登录页，直接对外开放由 Servas 自己的账号体系鉴权，
      所以使用 public_path；建好账号后建议在设置里关闭公开注册。
    - 数据库在 /lzcapp/var/sqlite，随应用持久化，卸载前请先备份。
    - 未做实机验证。
